name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK derle ve yayınla
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper çalıştırma izni ver
        run: chmod +x gradlew

      - name: Debug APK derle
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: APK dosyasını workflow çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AKREP-JARVIS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
